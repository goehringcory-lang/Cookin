<html><head><meta property="og:title" content="Panzanella Recipe • 5★" data-next-head=""/><meta property="og:image" content="https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-facebookJumbo.jpg" data-next-head=""/><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"urn:nyt:ScoopRecipe:c3981e554a1455a18fd1de0706a6fdfa","@type":"Recipe","aggregateRating":{"@type":"AggregateRating","ratingCount":3546,"ratingValue":5},"author":{"@id":"nyt://person/5b6a0b7c-274c-584b-b151-4c6d3e0ca62f","@type":"Person","name":"Melissa Clark","url":"https://cooking.nytimes.com/author/melissa-clark"},"comment":[{"@type":"Comment","author":{"@type":"Person","name":"jgivenshtx"},"datePublished":"2026-11-14T07:04:50Z","text":"I omitted the mozzarella because panzanella is a parmigiano affair for me. The recipe is fantastic otherwise."},{"@type":"Comment","author":{"@type":"Person","name":"Ben"},"datePublished":"2026-09-16T16:46:45Z","text":"This is a great panzanella! but the recipe has timing issues. If you estimate 45 minutes for me to chop bread, toast it, chop tomatoes, tear mozzarella, rinse and chop other vegetables and herbs, and make dressing, I made this last night and time was already tight. Then if the toasted bread needs to soak for at least 30 minutes, then I think that soaking should either get started earlier on in the recipe, or the total recipe time should be extended. (Or the \"soak\" should be made optional)."},{"@type":"Comment","author":{"@type":"Person","name":"Wanderlust"},"datePublished":"2026-09-08T08:50:46Z","text":"Is the bread in this supposed to be soggy for some reason? I made as directed and it was not a hit. Might make it again but add the toasted bread just before serving so it remains crunchy. Flavors were certainly good but soggy bread ruined it."},{"@type":"Comment","author":{"@type":"Person","name":"carol s."},"datePublished":"2026-09-05T02:25:54Z","text":"I am not crazy about adding the mozzarella to this recipe. If you use fresh, it tends to make it look kind of milky. Maybe add right before serving if you are committed to it."},{"@type":"Comment","author":{"@type":"Person","name":"jen"},"datePublished":"2026-08-19T18:05:40Z","text":"love this--have made many iterations with all sorts of additions (corn, snap peas, chickpeas, dill, etc.) and it's always great. tried it recently with storebought focaccia instead of ciabatta or baguette, because it's what they had at my grocery store, and it did not work--bread got way too mushy so as to be unpleasant. while there's of course tons of flexibility with vegetable choices, stick to the bread suggestions as written!"},{"@type":"Comment","author":{"@type":"Person","name":"Jane Godlove"},"datePublished":"2026-08-17T17:36:55Z","text":"I added the kernels from a cooked ear of sweet corn. Nice complement!"},{"@type":"Comment","author":{"@type":"Person","name":"Hannah"},"datePublished":"2026-08-12T19:31:47Z","text":"If your kids, like mine, do not eat their pizza crusts, this is a great way to use them up! I cut up all the forlorn pizza crusts and then use them in lieu of the bread."},{"@type":"Comment","author":{"@type":"Person","name":"Bryan"},"datePublished":"2026-08-07T16:41:11Z","text":"Added pan grilled peaches for a little sweetness and it turned out amazing. Also, if you happen to burn your bread (as I did) just let the salad sit a bit longer before serving - it'll soften up nicely in the juices of the veggies."},{"@type":"Comment","author":{"@type":"Person","name":"A"},"datePublished":"2026-08-02T23:56:24Z","text":"Divine. I will be making this again! \n\nAdded chopped garlic stuffed olives & doubled the cuke"},{"@type":"Comment","author":{"@type":"Person","name":"Bellaverdi"},"datePublished":"2026-08-01T03:00:23Z","text":"This is such a pleasure to prepare.\nThis time I focused down on minimizing ingredients, focusing on tomatoes, bread cubes, basil. Left out the mozzarella, other herbs. Also, with croutons I used half in regular prep, the other half sprinkled on top at serving. Happiness in the mouth!"},{"@type":"Comment","author":{"@type":"Person","name":"VA"},"datePublished":"2026-07-31T16:18:09Z","text":"@Dom again, my Italian family does not add any acid, no lemon, no vinegar. Just salt the tomatoes, add a little water abd olive oil. It's the perfect dressing."},{"@type":"Comment","author":{"@type":"Person","name":"VA"},"datePublished":"2026-07-31T16:18:00Z","text":"@Eydie my family NEVER puts vinegar in this salad. We add a small amount of water to the tomatoes and olive oil. The water and salted tomato juice is enough acid."},{"@type":"Comment","author":{"@type":"Person","name":"Carol"},"datePublished":"2026-07-31T16:17:56Z","text":"I copy and paste into notes \"private\" and save. Notes print with the recipe even if I've done it months before. @Joel Nydahl"},{"@type":"Comment","author":{"@type":"Person","name":"S"},"datePublished":"2026-07-28T21:59:49Z","text":"@Chris buy croutons or defrost croutons and reheat in a frying pan/flat pan to crisp"},{"@type":"Comment","author":{"@type":"Person","name":"Addiella"},"datePublished":"2026-07-28T15:13:04Z","text":"Is it good to chill this salad while it sits? Or leave it at room temp?"},{"@type":"Comment","author":{"@type":"Person","name":"Joel Nydahl"},"datePublished":"2016-06-15T11:16:02Z","text":"Is there a way to print the notes along with the recipes?  Some are very helpful and it would be great to have them attached."},{"@type":"Comment","author":{"@type":"Person","name":"Tami"},"datePublished":"2015-08-29T10:51:07Z","text":"A very good dish to use up late summer garden bounty. But simplify the directions by chopping all the tomatoes first, tossing with all the salt to bring out their juices, and then add the other ingredients on top. Add the vinaigrette. Mix and let sit. <br/><br/>Oil-cured olives and baby arugula were nice additions to my try."},{"@type":"Comment","author":{"@type":"Person","name":"Kim"},"datePublished":"2018-08-23T00:02:15Z","text":"I first made Ina’s take on this salade, (cucs, tomato, Bell peppers, red onion, bread croutons) and have learned that variations on the theme (tuna, capers, mozzarella, garbanzo beans, olives, arugula), make a delicious, light dinner.   I have eaten many versions in Italy.  Whatever great ingredients are in season/to your taste should be your guide.  It’s a composed salad, not rocket science.  Lighten up Times readers and enjoy the late summer bounty and Melissa Clark’s brilliance."},{"@type":"Comment","author":{"@type":"Person","name":"Theo"},"datePublished":"2015-09-19T23:10:06Z","text":"I know this is probably sacrilege, but I prefer to un-panzanellize and have warm crusty bread on the side.  That having been said, LOVED this salad.  Agree that the capers get lost, but I found adding oil-cured olives, sliced in half, gave the salad an extra kick."},{"@type":"Comment","author":{"@type":"Person","name":"Terrence McCarthy"},"datePublished":"2016-06-14T21:01:19Z","text":"I love this recipe. My one suggestion is to presoak the sliced red onion in several changes of water to sweeten them. I think the sweetness adds balance."},{"@type":"Comment","author":{"@type":"Person","name":"Nancy"},"datePublished":"2015-07-07T00:45:06Z","text":"You don't need all that olive oil either. 1TBSP with the bread cubes will suffice. 2 TBSP for the dressing is more than enough. Shaves off 6.5 grams fat and 60 calories per serving."},{"@type":"Comment","author":{"@type":"Person","name":"SundayCook"},"datePublished":"2016-09-14T12:47:29Z","text":"Too many steps.  I start by combining all the \"dressing\" ingredients from steps 2 &3.  Then I pour the dressing over the remaining ingredients of bread, cheese, tomatoes, cucumbers, parsley and basil.  Let is rest for 30 minutes and within 5 minutes of serving it is gone.  I serve it will grilled chicken and my teenage kids can't get enough."},{"@type":"Comment","author":{"@type":"Person","name":"Charles Michener"},"datePublished":"2017-02-26T20:03:46Z","text":"If you chop the ripe tomatoes into too small a dice - I recommend nothing smaller than 1\" - and you salt them way ahead of time, you will have tomato mush before long. Mix tomatoes, capers, cucumbers ahead of time (no more than two hours, in my opinion), refrigerate, and DON'T add salt until maybe 10 minutes before serving - at room temperature. The capers will have added enough salt beforehand."},{"@type":"Comment","author":{"@type":"Person","name":"Jo"},"datePublished":"2016-08-10T18:06:18Z","text":"I'd rather put some more in. Olive oil is very healthy. You loose some of the italian taste by saving it."},{"@type":"Comment","author":{"@type":"Person","name":"Ruth K Meyer"},"datePublished":"2015-07-11T19:54:07Z","text":"Learned Panzanella in Florence in 1966. Okay cucumbers, okay with thyme, but capers? No way. Mozzarella maybe, but this was supposed to be peasant food, folks. It doesn't need to be so dressed up. Serve with prosciutto and melon."},{"@type":"Comment","author":{"@type":"Person","name":"Jayelee"},"datePublished":"2017-01-24T11:03:55Z","text":"You say it is a peasant food, and the mozzarella maybe, but then suggest prosciutto and melon??? Last time I shopped prosciutto was much more $$ than mozzarella! I think it's great."},{"@type":"Comment","author":{"@type":"Person","name":"Sara"},"datePublished":"2016-08-31T11:19:31Z","text":"The full amount of olive oil results in wonderfully toasted croutons that stand up better to the moisture of the dressing and vegetables - I wouldn't skimp on it.  And the oil in the dressing balances the acidity of other ingredients and amplifies the flavor and mouthfeel.<br/><br/>Is there a reason for not just adding each ingredient to one big bowl as its chopped?"},{"@type":"Comment","author":{"@type":"Person","name":"Lobsterman"},"datePublished":"2016-08-26T12:08:16Z","text":"I highlighted the comments and cut and pasted them into a Word document, and printed on the back of the recipe.  But that was with Microsoft tools."},{"@type":"Comment","author":{"@type":"Person","name":"Theresa Fox"},"datePublished":"2017-08-18T17:16:41Z","text":"Big woop. Live a little. Olive oil is good for you."},{"@type":"Comment","author":{"@type":"Person","name":"msoliva"},"datePublished":"2015-12-08T19:21:07Z","text":"I've made a version that included anchovvy paste, and a variety of bell peppers (red, yellow, and green) that packed a tremendous flavor wallop...."}],"commentCount":288,"copyrightHolder":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"copyrightYear":2015,"dateModified":"2026-06-22T19:21:33.762Z","datePublished":"2015-07-08T00:00:00Z","description":"At the height of tomato season, for every perfectly ripe, taut and juicy specimen there’s an overripe, oozing counterpart not far away. The Tuscan bread salad called panzanella is the perfect place to use those sad, soft tomatoes that are still rich in flavor. Traditional panzanella is made with stale, dried bread that’s rehydrated with a dressing of sweet tomato juices, vinegar and plenty of olive oil. This version includes mozzarella for richness and cucumber for crunch. It’s an ideal do-ahead dish; the longer the mixture sits (up to 6 or so hours), the better it tastes. Just be sure to dry your bread out thoroughly in the oven so it won’t turn to mush. For a make-ahead summer party, serve alongside crunchy fried chicken and round out the meal with a luscious coconut cake accented with peaches.","image":[{"@id":"nyt://image/1313019e-9eaa-50f8-b33b-0179efe71eb7#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-videoSixteenByNineJumbo1600.jpg","creditText":"Rachel Vanni for The New York Times. Food Stylist: Spencer Richards.","dateModified":"2025-07-02T18:38:12.190Z","datePublished":"2025-07-02T18:38:12.190Z","height":"900","uploadDate":"2025-07-02T18:38:12.190Z","url":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-videoSixteenByNineJumbo1600.jpg","width":"1600"},{"@id":"nyt://image/1313019e-9eaa-50f8-b33b-0179efe71eb7#googleFourByThree","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-googleFourByThree.jpg","creditText":"Rachel Vanni for The New York Times. Food Stylist: Spencer Richards.","dateModified":"2025-07-02T18:38:12.190Z","datePublished":"2025-07-02T18:38:12.190Z","height":"600","uploadDate":"2025-07-02T18:38:12.190Z","url":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-googleFourByThree.jpg","width":"800"},{"@id":"nyt://image/1313019e-9eaa-50f8-b33b-0179efe71eb7#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-mediumSquareAt3X.jpg","creditText":"Rachel Vanni for The New York Times. Food Stylist: Spencer Richards.","dateModified":"2025-07-02T18:38:12.190Z","datePublished":"2025-07-02T18:38:12.190Z","height":"1800","uploadDate":"2025-07-02T18:38:12.190Z","url":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-mediumSquareAt3X.jpg","width":"1800"},{"@id":"nyt://image/1313019e-9eaa-50f8-b33b-0179efe71eb7#facebookJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-facebookJumbo.jpg","creditText":"Rachel Vanni for The New York Times. Food Stylist: Spencer Richards.","dateModified":"2025-07-02T18:38:12.190Z","datePublished":"2025-07-02T18:38:12.190Z","height":"550","uploadDate":"2025-07-02T18:38:12.190Z","url":"https://static01.nyt.com/images/2025/07/02/multimedia/MC-Panzanella-jhfm/MC-Panzanella-jhfm-facebookJumbo.jpg","width":"1050"}],"isAccessibleForFree":false,"keywords":"Mozzarella, Tomato","mainEntityOfPage":{"@id":"//cooking.nytimes.com/recipes/1017518-panzanella","@type":"WebPage","name":"Panzanella"},"name":"Panzanella","nutrition":{"@type":"NutritionInformation","calories":"289","carbohydrateContent":"17.6 grams","cholesterolContent":"22.4 milligrams","fatContent":"20.7 grams","fiberContent":"3 grams","proteinContent":"9.8 grams","saturatedFatContent":"6 grams","sodiumContent":"530.3 milligrams","sugarContent":"5.4 grams","unsaturatedFatContent":"2 grams"},"publisher":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"recipeCategory":"Appetizer, Dinner, Lunch, Salad, Side Dish","recipeCuisine":"Italian","recipeIngredient":["4 ounces ciabatta or baguette, preferably stale, cut into 1-inch cubes (about 3 cups)","6 tablespoons extra-virgin olive oil, more to taste","¾ teaspoon kosher sea salt, more to taste","2 pounds very ripe tomatoes, preferably a mix of varieties and colors","6 ounces fresh mozzarella, torn or cut into bite-size pieces","½ cup thinly sliced red onion, about half a small onion","2 garlic cloves, grated to a paste","2 tablespoons red wine vinegar, more to taste","1 tablespoon chopped fresh oregano or thyme (or a combination)","Large pinch red-pepper flakes (optional)","½ teaspoon Dijon mustard","Black pepper, to taste","½ cup thinly sliced Persian or Kirby cucumber, about 1 small cucumber","½ cup torn basil leaves","¼ cup flat-leaf parsley leaves, roughly chopped","1 tablespoon capers, drained"],"recipeInstructions":[{"@type":"HowToStep","image":[{"@id":"nyt://image/deb6fe08-b6a5-54ba-b8df-80b25d702250#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-videoSixteenByNineJumbo1600.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:18:44.326Z","datePublished":"2023-09-15T20:18:44.326Z","height":"900","uploadDate":"2023-09-15T20:18:44.326Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-videoSixteenByNineJumbo1600.jpg","width":"1600"},{"@id":"nyt://image/deb6fe08-b6a5-54ba-b8df-80b25d702250#superJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-superJumbo.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:18:44.326Z","datePublished":"2023-09-15T20:18:44.326Z","height":"1080","uploadDate":"2023-09-15T20:18:44.326Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-superJumbo.jpg","width":"1920"},{"@id":"nyt://image/deb6fe08-b6a5-54ba-b8df-80b25d702250#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-mediumSquareAt3X.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:18:44.326Z","datePublished":"2023-09-15T20:18:44.326Z","height":"1080","uploadDate":"2023-09-15T20:18:44.326Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-mediumSquareAt3X.jpg","width":"1080"},{"@id":"nyt://image/deb6fe08-b6a5-54ba-b8df-80b25d702250#facebookJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-facebookJumbo.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:18:44.326Z","datePublished":"2023-09-15T20:18:44.326Z","height":"549","uploadDate":"2023-09-15T20:18:44.326Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step01-Browned-Bread/Panzanella-With-Mozz-Step01-Browned-Bread-facebookJumbo.jpg","width":"1050"}],"text":"Heat oven to 425 degrees. Spread the bread cubes on a rimmed baking sheet and toss with 2 tablespoons oil and a pinch of salt. Bake until they are dried out and pale golden brown at the edges, about 7 to 15 minutes. Let cool on a wire rack.","url":"https://cooking.nytimes.com/recipes/1017518-panzanella#recipe-step-1"},{"@type":"HowToStep","image":[{"@id":"nyt://image/d2b4a216-a207-5ac1-a562-1fcfde7f6843#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-videoSixteenByNineJumbo1600.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:23:54.351Z","datePublished":"2023-09-15T20:23:54.351Z","height":"900","uploadDate":"2023-09-15T20:23:54.351Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-videoSixteenByNineJumbo1600.jpg","width":"1600"},{"@id":"nyt://image/d2b4a216-a207-5ac1-a562-1fcfde7f6843#superJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-superJumbo.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:23:54.351Z","datePublished":"2023-09-15T20:23:54.351Z","height":"1080","uploadDate":"2023-09-15T20:23:54.351Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-superJumbo.jpg","width":"1920"},{"@id":"nyt://image/d2b4a216-a207-5ac1-a562-1fcfde7f6843#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-mediumSquareAt3X.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:23:54.351Z","datePublished":"2023-09-15T20:23:54.351Z","height":"1080","uploadDate":"2023-09-15T20:23:54.351Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-mediumSquareAt3X.jpg","width":"1080"},{"@id":"nyt://image/d2b4a216-a207-5ac1-a562-1fcfde7f6843#facebookJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-facebookJumbo.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:23:54.351Z","datePublished":"2023-09-15T20:23:54.351Z","height":"549","uploadDate":"2023-09-15T20:23:54.351Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl/Panzanella-With-Mozz-Step02-Ingredients-In-Bowl-facebookJumbo.jpg","width":"1050"}],"text":"Cut tomatoes into bite-size pieces and transfer to a large bowl. Add mozzarella, onions, garlic paste, 1 tablespoon vinegar, oregano or thyme, ¼ teaspoon salt and the red-pepper flakes if using. Toss to coat and set aside.","url":"https://cooking.nytimes.com/recipes/1017518-panzanella#recipe-step-2"},{"@type":"HowToStep","text":"In a medium bowl, combine remaining 1 tablespoon vinegar, the mustard, ¼ teaspoon salt and some black pepper to taste. While whisking constantly, slowly drizzle in the remaining 4 tablespoons olive oil until the mixture is thickened. Stir in cucumbers, basil and parsley.","url":"https://cooking.nytimes.com/recipes/1017518-panzanella#recipe-step-3","video":{"@id":"nyt://video/02ae1d7d-4f9e-5f6b-8393-0396770d331a","@type":"VideoObject","author":{"@id":"nyt://person/0f1a5b18-7e38-59fe-8132-b5015cd37148","@type":"Person","name":"The New York Times","url":"https://www.nytimes.com/by/the-new-york-times"},"b ":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step04-Herbs-Pre-Toss/Panzanella-With-Mozz-Step04-Herbs-Pre-Toss-facebookJumbo.jpg","creditText":"The New York Times Cooking","dateModified":"2023-09-15T20:37:32.153Z","datePublished":"2023-09-15T20:37:32.153Z","height":"549","uploadDate":"2023-09-15T20:37:32.153Z","url":"https://static01.nyt.com/images/2023/09/15/dining/Panzanella-With-Mozz-Step04-Herbs-Pre-Toss/Panzanella-With-Mozz-Step04-Herbs-Pre-Toss-facebookJumbo.jpg","width":"1050"}],"text":"Add bread cubes, cucumber mixture and capers to the tomatoes and toss well. Let sit for at least 30 minutes and up to 4 hours before serving. Toss with a little more olive oil, vinegar and salt if needed just before serving.","url":"https://cooking.nytimes.com/recipes/1017518-panzanella#recipe-step-4"}],"recipeYield":"6 servings","totalTime":"PT45M","url":"//cooking.nytimes.com/recipes/1017518-panzanella"}</script><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"//cooking.nytimes.com/recipes/1017518-panzanella","@type":"WebPage","author":{"@id":"nyt://person/5b6a0b7c-274c-584b-b151-4c6d3e0ca62f","@type":"Person","name":"Melissa Clark","url":"https://cooking.nytimes.com/author/melissa-clark"},"copyrightHolder":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"copyrightYear":2015,"dateModified":"2026-06-22T19:21:33.762Z","datePublished":"2015-07-08T00:00:00Z","description":"At the height of tomato season, for every perfectly ripe, taut and juicy specimen there’s an overripe, oozing counterpart not far away. The Tuscan bread salad called panzanella is the perfect place to use those sad, soft tomatoes that are still rich in flavor. Traditional panzanella is made with stale, dried bread that’s rehydrated with a dressing of sweet tomato juices, vinegar and plenty of olive oil. This version includes mozzarella for richness and cucumber for crunch. It’s an ideal do-ahead dish; the longer the mixture sits (up to 6 or so hours), the better it tastes. Just be sure to dry your bread out thoroughly in the oven so it won’t turn to mush. For a make-ahead summer party, serve alongside crunchy fried chicken and round out the meal with a luscious coconut cake accented with peaches.","hasPart":{"@type":"WebPageElement","cssSelector":".recipe","isAccessibleForFree":false},"isAccessibleForFree":false,"isPartOf":{"@type":["CreativeWork","Product"],"name":"NYT Cooking","productID":"cooking.nytimes.com:basic"},"name":"Panzanella","publisher":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"url":"//cooking.nytimes.com/recipes/1017518-panzanella"}</script><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","alternateName":["nytimes cooking","New York Times Cooking"],"diversityPolicy":"https://www.nytco.com/company/diversity-and-inclusion/","ethicsPolicy":"https://www.nytco.com/company/standards-ethics/","foundingDate":"2014-09-17","logo":{"@type":"ImageObject","contentUrl":"https://static01.nyt.com/applications/cooking/623885b/assets/SiteLogoBlack-112x112.svg","creditText":"NYT Cooking","height":"112","url":"https://static01.nyt.com/applications/cooking/623885b/assets/SiteLogoBlack-112x112.svg","width":"112"},"name":"NYT Cooking","parentOrganization":{"@id":"https://www.nytimes.com/#publisher","@type":"NewsMediaOrganization","name":"The New York Times"},"sameAs":["https://www.facebook.com/nytcooking/","https://www.instagram.com/nytcooking/","https://www.youtube.com/c/NYTCooking","https://www.tiktok.com/@nytcooking","https://apps.apple.com/us/app/nyt-cooking/id911422904","https://play.google.com/store/apps/details?id=com.nytimes.cooking&hl=en_US&gl=US"],"url":"https://cooking.nytimes.com"}</script><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"https://www.nyt
