<style>
/* Layout: phone-first single column, sticky header, fixed bottom tab bar; cards only for meals. */
:root {
  --bg: #f3f5ef; --surface: #ffffff; --sunk: #e8ece3; --ink: #1b221d; --muted: #5b675f; --line: #d5dccf;
  --herb: #2e6b4a; --herb-ink: #ffffff; --herb-soft: #dcebe0;
  --tomato: #c4472a; --tomato-soft: #f8e2db; --mustard: #a8770c; --mustard-soft: #f5ead0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111512; --surface: #1a201c; --sunk: #232a25; --ink: #e7ece7; --muted: #9ba79f; --line: #2f3832;
  --herb: #74c495; --herb-ink: #0d1a12; --herb-soft: #1f3528;
  --tomato: #f08465; --tomato-soft: #3a221b; --mustard: #e2b450; --mustard-soft: #352c16; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111512; --surface: #1a201c; --sunk: #232a25; --ink: #e7ece7; --muted: #9ba79f; --line: #2f3832;
  --herb: #74c495; --herb-ink: #0d1a12; --herb-soft: #1f3528;
  --tomato: #f08465; --tomato-soft: #3a221b; --mustard: #e2b450; --mustard-soft: #352c16; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em }
h2 { font-size: 1.45rem } h3 { font-size: 1.05rem }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--herb); outline-offset: 2px }
a { color: var(--herb) }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px }
.brand { font-size: 1.35rem; color: var(--herb) }
.sub { color: var(--muted); font-size: .85rem }
main.wrap { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 22px }
section { display: flex; flex-direction: column; gap: 10px }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.grow { flex: 1; min-width: 0 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 500 }
.btn.primary { background: var(--herb); color: var(--herb-ink); border-color: var(--herb) }
.btn.ghost { background: transparent }
.btn.small { padding: 5px 11px; font-size: .85rem }
.btn.danger { color: var(--tomato); border-color: var(--tomato) }
.btn:disabled { opacity: .5; cursor: default }
.field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
textarea.field { min-height: 90px; resize: vertical }
.muted { color: var(--muted) } .small { font-size: .85rem }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center }

/* Tonight strip */
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; margin-inline: -4px; padding-inline: 4px }
.alt { flex: 0 0 72%; max-width: 260px; scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.alt b { font-family: var(--display); font-size: 1rem; line-height: 1.25 }
.chiprow { display: flex; gap: 6px; flex-wrap: wrap }
.tag { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap }
.tag.ok { background: var(--herb-soft); color: var(--herb) }
.tag.need { background: var(--tomato-soft); color: var(--tomato) }
.tag.quick { background: var(--mustard-soft); color: var(--mustard) }
.seg { display: flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 10px; border-radius: 999px; font-weight: 500; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08) }

/* Week */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 52px 1fr; gap: 4px 12px }
.day.today { border-color: var(--herb); box-shadow: 0 0 0 1px var(--herb) inset }
.dname { grid-row: span 2; display: flex; flex-direction: column; line-height: 1.1 }
.dname b { font-family: var(--display); font-size: 1.1rem }
.dname span { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums }
.slot { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; border: 0; background: transparent; padding: 6px 0; width: 100% }
.slot + .slot { border-top: 1px solid var(--line) }
.slot .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 50px; flex: none }
.slot .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500 }
.slot .t.add { color: var(--herb); font-weight: 500 }
.slot .t.off { color: var(--muted); font-weight: 400; font-style: italic }

/* Lists */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.li { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border: 0; background: transparent; text-align: left; width: 100%; min-width: 0 }
.li + .li { border-top: 1px solid var(--line) }
.li .grow > div:first-child { overflow-wrap: anywhere }
.box { width: 22px; height: 22px; flex: none; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; color: var(--herb-ink) }
.li.done .box { background: var(--herb); border-color: var(--herb) }
.li.done .name { text-decoration: line-through; color: var(--muted) }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line) }
.dot.ok { background: var(--herb) } .dot.need { background: var(--tomato) } .dot.unk { background: transparent; border: 2px dashed var(--muted) }

/* Kitchen chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: .9rem; display: inline-flex; gap: 6px; align-items: center }
.chip[aria-pressed="true"] { background: var(--herb); color: var(--herb-ink); border-color: var(--herb) }
.chip[aria-pressed="true"]::before { content: "✓"; font-weight: 700 }
.cathead { display: flex; justify-content: space-between; align-items: baseline }
.linkbtn { border: 0; background: none; color: var(--herb); padding: 2px 0; font-weight: 500; font-size: .85rem }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr) }
nav.tabs button { border: 0; background: none; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: .75rem; font-weight: 500 }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
nav.tabs button[aria-current="page"] { color: var(--herb) }
.badge { background: var(--tomato); color: #fff; border-radius: 999px; font-size: .65rem; padding: 0 6px; margin-left: 2px }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,14,11,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; margin-top: -6px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; z-index: 30; font-size: .9rem; max-width: calc(100% - 32px) }
.note { background: var(--mustard-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: .9rem }
.steps { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px }
.bm { display: inline-block; padding: 8px 14px; border-radius: 999px; background: var(--herb); color: var(--herb-ink); text-decoration: none; font-weight: 600 }
details > summary { cursor: pointer; font-weight: 600; color: var(--herb) }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
</style>

  if (x.t === "left") { const d = S.plan.days[x.from]; const r = d && d.dinner && d.dinner.t === "r" && S.recipes.get(d.dinner.id); return "Leftovers" + (r ? ": " + r.title : ""); }
  if (x.t === "idea") { const l = LUNCH_IDEAS.find(l => l.id === x.id); return l ? l.name : "Lunch"; }
  if (x.t === "out") return "On your own";
  return null;
}
function slotLunch(d, i) {
  const lab = lunchLabel(d.lunch);
  let tag = "";
  if (d.lunch && d.lunch.t === "idea") { const l = LUNCH_IDEAS.find(l => l.id === d.lunch.id); const miss = l ? l.items.filter(id => !has(id)).length : 0; tag = miss ? `<span class="tag need">${miss} to buy</span>` : ""; }
  return `<button class="slot" data-act="lunch" data-day="${i}"><span class="k">Lunch</span>${lab ? `<span class="t${d.lunch.t === "out" ? " off" : ""}">${esc(lab)}</span>` : '<span class="t add">+ Pick lunch</span>'}${tag}</button>`;
}
function suggestDinners() {
  if (!S.recipes.size) { toast("Sync your NYT recipes first"); return; }
  const used = new Set(plannedRecipeIds()), recent = new Set(S.plan.recent || []);
  const pool = recipesArr().filter(r => !used.has(r.id)).map(r => { const st = recipeStats(r); const frac = st.total ? st.haveN / st.total : 0; return { r, score: frac * 0.7 + Math.random() * 0.3 - (recent.has(r.id) ? 0.35 : 0) }; }).sort((a, b) => b.score - a.score);
  let n = 0;
  S.plan.days.forEach(d => { if (!d.dinner && pool.length) { d.dinner = { t: "r", id: pool.shift().r.id }; n++; } });
  savePlan(); render(); toast(n ? `Suggested ${n} dinner${n > 1 ? "s" : ""}. Tap one to swap it.` : "Every night already has a plan");
}
function fillLunches() {
  const usedLeft = new Set(S.plan.days.map(d => d.lunch && d.lunch.t === "left" ? d.lunch.from : -1));
  const usedIdea = new Set(S.plan.days.map(d => d.lunch && d.lunch.t === "idea" ? d.lunch.id : ""));
  const ideas = LUNCH_IDEAS.map(l => ({ l, s: l.items.filter(has).length / l.items.length + Math.random() * 0.5 })).sort((a, b) => b.s - a.s).map(x => x.l).filter(l => !usedIdea.has(l.id));
  S.plan.days.forEach((d, i) => {
    if (d.lunch) return;
    const prev = i > 0 && S.plan.days[i - 1].dinner;
    if (prev && prev.t === "r" && !usedLeft.has(i - 1)) { d.lunch = { t: "left", from: i - 1 }; usedLeft.add(i - 1); }
    else if (ideas.length) d.lunch = { t: "idea", id: ideas.shift().id };
  });
  savePlan(); render(); toast("Lunches filled. Leftovers come from the night before.");
}
function newWeek() {
  const cur = parseYmd(S.plan.weekStart), thisMon = mondayOf(new Date());
  const next = new Date(cur); next.setDate(cur.getDate() + 7);
  const start = next > thisMon ? next : thisMon;
  const recent = [...plannedRecipeIds(), ...(S.plan.recent || [])].slice(0, 30);
  S.plan = { weekStart: ymd(start), days: DAYS.map(() => ({ dinner: null, lunch: null })), recent };
  S.shop.bought = {}; S.shop.dismissed = {};
  savePlan(); saveShop(); render(); toast("New week started");
}

/* ----- shopping ----- */
function shoppingData() {
  const need = new Map(), check = new Map();
  const add = (map, key, name, from) => { const e = map.get(key) || { key, name, from: [] }; if (from && e.from.indexOf(from) < 0) e.from.push(from); map.set(key, e); };
  if (!S.plan || !S.inv) return { need: [], check: [], extras: [] };
  for (const d of S.plan.days) {
    if (d.dinner && d.dinner.t === "r") {
      const r = S.recipes.get(d.dinner.id); if (!r) continue;
      const a = analyze(r);
      for (const id of a.items) if (!has(id) && ITEMS[id]) add(need, "i:" + id, ITEMS[id].name, r.title);
      for (const line of a.unknown) { const n = cleanName(line); const k = "l:" + n.toLowerCase(); if (!S.shop.dismissed[k]) add(check, k, n, r.title); }
    }
    if (d.lunch && d.lunch.t === "idea") {
      const l = LUNCH_IDEAS.find(l => l.id === d.lunch.id);
      if (l) for (const id of l.items) if (!has(id) && ITEMS[id]) add(need, "i:" + id, ITEMS[id].name, l.name);
    }
  }
  const extras = (S.shop.extras || []).map(x => ({ key: "x:" + x.id, name: x.name, from: [], extra: true }));
  return { need: [...need.values()].sort((a, b) => a.name.localeCompare(b.name)), check: [...check.values()].sort((a, b) => a.name.localeCompare(b.name)), extras };
}
function viewList() {

  const rows = all.map(x => `<button class="li${S.shop.bought[x.key] ? " done" : ""}" data-act="buy" data-key="${esc(x.key)}"><span class="box">${S.shop.bought[x.key] ? "✓" : ""}</span>
      <span class="grow"><div class="name">${esc(x.name)}</div>${x.from.length ? `<div class="small muted">${esc(x.from.join(" · "))}</div>` : x.extra ? '<div class="small muted">Added by you</div>' : ""}</span></button>`).join("");
  return `<section><div class="row between"><div><div class="eyebrow">Shopping list</div><h2>${all.length ? all.length - bought + " to get" : "Nothing to buy"}</h2></div>
      <button class="btn primary" data-act="keep"${all.length ? "" : " disabled"}>Copy for Keep</button></div>
      ${all.length ? `<div class="list">${rows}</div>` : `<div class="empty">Plan some meals on This week and anything you're missing shows up here.</div>`}
      <form class="row" data-form="extra"><input class="field grow" id="extraIn" placeholder="Add something else, like paper towels" autocomplete="off"><button class="btn">Add</button></form>
      ${bought ? `<button class="btn primary" data-act="finish">Done shopping: put ${bought} item${bought > 1 ? "s" : ""} in my kitchen</button>` : ""}
    </section>
    ${check.length ? `<section><h3>Double-check these</h3><p class="small muted" style="margin:0">Your recipes use these, but they aren't in your kitchen list, so Cokkin can't tell if you have them.</p>
      <div class="list">${check.map(x => `<div class="li"><span class="dot unk"></span><span class="grow"><div>${esc(x.name)}</div><div class="small muted">${esc(x.from.join(" · "))}</div></span>
        <button class="btn small" data-act="check-add" data-key="${esc(x.key)}" data-name="${esc(x.name)}">Add to list</button><button class="btn small ghost" data-act="check-have" data-key="${esc(x.key)}" data-name="${esc(x.name)}">Have it</button></div>`).join("")}</div></section>` : ""}
    <section><details><summary>How to send this to Google Keep</summary><ol class="steps small" style="margin-top:8px">
      <li>Tap <b>Copy for Keep</b>.</li><li>Open your grocery note in Google Keep (or make a new note and choose <b>Show checkboxes</b>).</li>

      <p class="small" style="margin:8px 0 0"><a href="https://keep.google.com/" target="_blank" rel="noopener">Open Google Keep</a></p></details></section>`;

async function importPaste(text) {
  let data;
  try { const i = text.indexOf("{"); data = JSON.parse(text.slice(i)); } catch (e) { toast("That isn't a Cokkin sync. Copy it again from the NYT page."); return; }
  if (!data || data.cokkin !== 1 || !Array.isArray(data.recipes)) { toast("That isn't a Cokkin sync. Copy it again from the NYT page."); return; }
  const todo = [];
  for (const r of data.recipes) {
    if (!r || typeof r.id !== "string" || !/^nyt-\d+$/.test(r.id) || !r.title) continue;
    const ing = (Array.isArray(r.ing) ? r.ing : []).map(String).slice(0, 80);
    const cur = S.recipes.get(r.id);
    const doc = { title: String(r.title).slice(0, 200), url: safeHttps(r.url), ing, mins: isoMinutes(r.time), yield: String(r.yield || "").slice(0, 60), cat: String(r.cat || "").slice(0, 120), source: "nyt", addedAt: cur && cur.addedAt || Date.now() };
    if (!cur || cur.title !== doc.title || JSON.stringify(cur.ing) !== JSON.stringify(ing) || cur.mins !== doc.mins) todo.push([r.id, doc]);
  }
  S.pasteBusy = true; render();
  let done = 0, fail = 0, i = 0;
  const work = async () => { while (i < todo.length) { const [id, doc] = todo[i++]; try { await db.doc("recipes/" + id).set(doc); } catch (e) { fail++; } done++; } };
  await Promise.all([work(), work(), work(), work()]);
  try { await db.doc("kitchen/sync").set({ lastSync: Date.now(), total: data.recipes.length, added: done - fail, by: "Sync button" }); } catch (e) {}
  S.pasteBusy = false; render();
  toast(todo.length ? `Synced: ${done - fail} new or updated recipe${done - fail === 1 ? "" : "s"}${fail ? ", " + fail + " failed" : ""}` : "Already up to date");
}

}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab]");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act, d = t.dataset;
  if (a === "scrim") { if (e.target === t) closeSheet(); return; }
  if (a === "bm") { e.preventDefault(); toast("Drag this to your bookmarks bar instead of tapping it"); return; }
  switch (a) {
    case "close": closeSheet(); break;
    case "toggle": S.inv.have[d.id] = !has(d.id); if (!S.inv.have[d.id]) delete S.inv.have[d.id]; saveInv(); render(); break;
    case "cat-all": for (const it of Object.values(ITEMS)) if (it.loc === d.loc && it.cat === d.cat) { if (d.on === "1") S.inv.have[it.id] = true; else delete S.inv.have[it.id]; } saveInv(); render(); break;
    case "setup-next": S.setupStep++; render(); window.scrollTo(0, 0); break;
    case "setup-back": S.setupStep = Math.max(0, S.setupStep - 1); render(); window.scrollTo(0, 0); break;
    case "setup-done": S.inv.setupDone = true; saveInv(); S.tab = S.recipes.size ? "plan" : "recipes"; render(); window.scrollTo(0, 0); break;
    case "rerun-setup": S.inv.setupDone = false; S.setupStep = 0; saveInv(); render(); window.scrollTo(0, 0); break;
    case "loc": S.kitchenLoc = d.loc; S.kq = ""; render(); break;
    case "alt-mode": S.altMode = d.mode; render(); break;
    case "suggest": suggestDinners(); break;
    case "lunches": fillLunches(); break;
    case "new-week": newWeek(); break;
    case "dinner": dinnerSheet(+d.day); break;
    case "lunch": lunchSheet(+d.day); break;
    case "sheet-mode": dinnerSheet.state.setMode(d.mode); break;
    case "open-recipe": recipeSheet(d.id, d.day != null ? +d.day : null); break;
    case "show-days": recipeSheet.state.toggleDays(); break;
    case "assign": { const i = +d.day; S.plan.days.forEach((x, j) => { if (j !== i && x.dinner && x.dinner.t === "r" && x.dinner.id === d.id) x.dinner = null; }); S.plan.days[i].dinner = { t: "r", id: d.id }; savePlan(); closeSheet(); render(); const r = S.recipes.get(d.id); toast((r ? r.title : "Recipe") + " is on for " + DAYS[i]); break; }
    case "clear-dinner": S.plan.days[+d.day].dinner = null; savePlan(); closeSheet(); render(); break;
    case "dinner-out": S.plan.days[+d.day].dinner = { t: "out" }; savePlan(); closeSheet(); render(); break;
    case "set-lunch": { const day = S.plan.days[+d.day]; day.lunch = d.kind === "left" ? { t: "left", from: +d.from } : d.kind === "idea" ? { t: "idea", id: d.id } : d.kind === "out" ? { t: "out" } : null; savePlan(); closeSheet(); render(); break; }
    case "del-recipe": if (!recipeSheet.state.getConfirm()) { recipeSheet.state.setConfirm(true); break; }
      try { await db.doc("recipes/" + d.id).delete(); S.plan.days.forEach(x => { if (x.dinner && x.dinner.id === d.id) x.dinner = null; }); savePlan(); closeSheet(); toast("Recipe removed"); } catch (err) { toast("Couldn't remove it. Try again."); } break;
    case "buy": S.shop.bought[d.key] = !S.shop.bought[d.key]; if (!S.shop.bought[d.key]) delete S.shop.bought[d.key]; saveShop(); render(); break;
    case "keep": { const { need, extras } = shoppingData(); const lines = [...need, ...extras].filter(x => !S.shop.bought[x.key]).map(x => x.name); copyText(lines.join("\n"), `Copied ${lines.length} items. Paste them into your Keep note.`); break; }
    case "finish": { const { need, extras } = shoppingData(); let n = 0;
      for (const x of [...need, ...extras]) if (S.shop.bought[x.key]) { n++; if (x.key.startsWith("i:")) S.inv.have[x.key.slice(2)] = true; if (x.extra) { S.shop.extras = S.shop.extras.filter(e => "x:" + e.id !== x.key); const m = matchLine(x.name); m.forEach(id => S.inv.have[id] = true); } }
      S.shop.bought = {}; saveInv(); saveShop(); render(); toast(`${n} item${n === 1 ? "" : "s"} added to your kitchen`); break; }
    case "check-add": S.shop.extras.push({ id: "e" + Date.now().toString(36), name: d.name }); S.shop.dismissed[d.key] = true; saveShop(); render(); break;
    case "check-have": { const id = "c-" + slug(d.name); if (!ITEMS[id]) S.inv.custom.push({ id, name: d.name, loc: "pantry" }); S.inv.have[id] = true; applyCustom(); saveInv(); render(); toast(d.name + " added to your pantry"); break; }
    case "copy-bm": copyText(BOOKMARKLET, "Bookmark code copied"); break;
    case "add-recipe": addRecipeSheet(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "kq") { S.kq = e.target.value; render(); }
  if (e.target.id === "rq") { S.rq = e.target.value; render(); }
  if (e.target.id === "dq") dinnerSheet.state.setQ(e.target.value);
});
document.addEventListener("paste", e => {
  if (e.target.id !== "pasteBox") return;
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (text) { e.preventDefault(); importPaste(text); }
});
document.addEventListener("change", e => { if (e.target.id === "pasteBox" && e.target.value.trim()) importPaste(e.target.value); });
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "extra") { const v = $("#extraIn").value.trim(); if (!v) return; S.shop.extras.push({ id: "e" + Date.now().toString(36), name: v.slice(0, 80) }); saveShop(); $("#extraIn").value = ""; render(); }
  if (f === "custom") { const v = $("#customIn").value.trim(); if (!v) return; const loc = $("#customLoc").value; const id = "c-" + slug(v); if (!ITEMS[id]) S.inv.custom.push({ id, name: v.slice(0, 60), loc }); S.inv.have[id] = true; applyCustom(); saveInv(); S.kitchenLoc = loc; render(); toast(v + " added to your " + LOC_NAMES[loc].toLowerCase()); }
  if (f === "recipe") {
    const title = $("#nrTitle").value.trim(), ing = $("#nrIng").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (!title || !ing.length) return;
    const id = "my-" + Date.now().toString(36);
    try { await db.doc("recipes/" + id).set({ title: title.slice(0, 200), ing: ing.slice(0, 80), mins: Math.max(0, parseInt($("#nrMins").value, 10) || 0), url: safeHttps($("#nrUrl").value.trim()), source: "manual", addedAt: Date.now() }); closeSheet(); toast("Recipe saved"); }
    catch (err) { toast("Couldn't save the recipe. Try again."); }
  }
});
rebuildAliases();
boot();
</script>
